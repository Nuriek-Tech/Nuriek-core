name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nuriek_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/nuriek_test
      NEXTAUTH_SECRET: ci-test-secret-min-32-chars-long
      NEXTAUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuriek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Fresh CI DB has no baseline migration; push schema for tests.
      - run: npx prisma db push --skip-generate

      - run: npm test

      - run: npm run lint

      - run: npm run build
