name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: tuuteez-0218
  REGION: us-central1
  SERVICE_NAME: nuriek-core
  # Create a Google Artifact Registry repository named 'containers' in your region first!
  REPOSITORY: containers

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud
      # Ensure you have set the GCP_CREDENTIALS secret in your GitHub repository
      # containing the Service Account JSON key.
      # Alternatively, you can use Workload Identity Federation by replacing credentials_json
      # with workload_identity_provider and service_account.
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # Configure Docker to use the gcloud command-line tool as a credential helper
      - name: Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # Build the Docker image
      - name: Build Docker image
        run: |-
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .

      # Push the Docker image to Google Artifact Registry
      - name: Push Docker image
        run: |-
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      # Deploy to Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |-
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DIRECT_URL=${{ secrets.DIRECT_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            PORTAL_PUBLIC_URL=${{ secrets.PORTAL_PUBLIC_URL }}
            ZOHO_USER=${{ secrets.ZOHO_USER }}
            ZOHO_PASSWORD=${{ secrets.ZOHO_PASSWORD }}
            ZOHO_FROM_NAME=${{ secrets.ZOHO_FROM_NAME }}
            ZOHO_SMTP_HOST=${{ secrets.ZOHO_SMTP_HOST }}
            ZOHO_SMTP_PORT=${{ secrets.ZOHO_SMTP_PORT }}
